name: Immunosuppression Trough Engine Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,dev]"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Validate source and installed CLI
      run: |
        python -m compileall -q agents immunosuppression_trough_agent cli.py transplant_tdm.py
        immunosuppression-trough-agent audit --task-id CI-001 --primary 1 --secondary 1

    - name: Browser module regression tests
      run: node --test web/app.test.mjs

    - name: In-memory audit integrity smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('In-memory audit initialization check passed')
        "
