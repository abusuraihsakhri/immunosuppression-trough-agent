[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "immunosuppression-trough-engine"
version = "2.0.0"
description = "TransplantTDM Sentinel: Tacrolimus, Cyclosporine & Everolimus Trough Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
immunosuppression-trough-engine = "immunosuppression_trough_agent.cli:main"
immunosuppression-trough-agent = "cli:main"
transplant-tdm = "transplant_tdm:main"

[tool.setuptools]
py-modules = ["cli", "transplant_tdm", "enrichment", "simulator", "immunosuppression_trough_agent_app", "transplant_tdm_app"]

[tool.setuptools.packages.find]
include = ["agents*", "immunosuppression_trough_agent*"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/immunosuppression-trough-agent"
Repository = "https://github.com/abusuraihsakhri/immunosuppression-trough-agent.git"
